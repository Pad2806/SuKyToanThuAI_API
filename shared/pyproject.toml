[project]
name = "sukyai-common"
version = "0.1.0"
description = "Shared utilities for SuKyAI FastAPI services"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "bcrypt>=4.0.1,<6.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "redis>=5.2.0",
  "SQLAlchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
