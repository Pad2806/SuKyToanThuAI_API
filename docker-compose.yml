version: "3.9"

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  sukyai_net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  minio_data:

# ── Build context helper ──────────────────────────────────────────────────────
# Every Python service is built from its own folder, with shared/ mounted in.
# The Dockerfile COPY shared/ /app/shared/ copies the shared lib into each image.

services:

  # ── 1. PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sukyai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sukyai
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - sukyai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sukyai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. MinIO (optional object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sukyai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sukyai_net

  # ── 3. Gateway (public entrypoint, port 8000) ─────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sukyai-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      CONTENT_SERVICE_URL: http://content-service:8002
      RAG_SERVICE_URL: http://rag-service:8003
      STORY_SERVICE_URL: http://story-service:8004
      AI_WORKER_URL: http://ai-worker:8005
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      - auth-service
      - content-service
      - rag-service
      - story-service
    networks:
      - sukyai_net

  # ── 4. Auth Service (internal port 8001) ──────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: sukyai-auth-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-sukyai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sukyai-api}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sukyai_net

  # ── 5. Content Service (internal port 8002) ───────────────────────────────
  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: sukyai-content-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      STORY_SERVICE_URL: http://story-service:8004
      RAG_SERVICE_URL: http://rag-service:8003
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sukyai_net

  # ── 6. RAG Service (internal port 8003) ───────────────────────────────────
  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    container_name: sukyai-rag-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      PUBLIC_CDN_BASE_URL: ${PUBLIC_CDN_BASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sukyai_net

  # ── 7. Story Service (internal port 8004) ─────────────────────────────────
  story-service:
    build:
      context: .
      dockerfile: services/story-service/Dockerfile
    container_name: sukyai-story-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      CONTENT_SERVICE_URL: http://content-service:8002
      RAG_SERVICE_URL: http://rag-service:8003
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sukyai_net

  # ── 8. AI Worker (no public port, background process) ─────────────────────
  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    container_name: sukyai-ai-worker
    restart: unless-stopped
    command: ["python", "-m", "app.main"]
    # Expose optional status port (job status API only, not routed by gateway by default)
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sukyai
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      IMAGE_MODEL: ${IMAGE_MODEL:-dall-e-3}
      AUTH_SERVICE_URL: http://auth-service:8001
      CONTENT_SERVICE_URL: http://content-service:8002
      RAG_SERVICE_URL: http://rag-service:8003
      STORY_SERVICE_URL: http://story-service:8004
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      WORKER_ID: ${WORKER_ID:-worker-001}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
      story-service:
        condition: service_started
      content-service:
        condition: service_started
    networks:
      - sukyai_net
