version: "3.9"

# Internal network — all services communicate through this
networks:
  sukyai_net:
    driver: bridge

volumes:
  pgdata:
  minio_data:

services:

  # ──────────────────────────────────────────────────────────
  # 1. DATABASE SERVICE (shared Postgres + pgvector)
  # ──────────────────────────────────────────────────────────
  sukyai-db:
    image: pgvector/pgvector:pg16
    container_name: sukyai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sukyai_db
      POSTGRES_USER: ${POSTGRES_USER:-sukyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sukyai_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sukyai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sukyai} -d sukyai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 2. OBJECT STORAGE (MinIO — local S3-compatible)
  # ──────────────────────────────────────────────────────────
  sukyai-minio:
    image: minio/minio:latest
    container_name: sukyai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 3. API GATEWAY (Traefik)
  # ──────────────────────────────────────────────────────────
  sukyai-gateway:
    image: traefik:v2.10
    container_name: sukyai-gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 4. AUTH SERVICE  (users, audit_log)
  # ──────────────────────────────────────────────────────────
  sukyai-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: sukyai-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sukyai}:${POSTGRES_PASSWORD:-sukyai_secret}@sukyai-db:5432/sukyai_db
      SECRET_KEY: ${SECRET_KEY}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      sukyai-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 5. CONTENT SERVICE  (eras, grades, lessons, topics, events)
  # ──────────────────────────────────────────────────────────
  sukyai-content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    container_name: sukyai-content
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sukyai}:${POSTGRES_PASSWORD:-sukyai_secret}@sukyai-db:5432/sukyai_db
      SECRET_KEY: ${SECRET_KEY}
      # Internal URL to call story-service for published story_json
      STORY_SERVICE_URL: http://sukyai-story:8000
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      sukyai-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content.rule=PathPrefix(`/api/v1/eras`) || PathPrefix(`/api/v1/grades`) || PathPrefix(`/api/v1/lessons`) || PathPrefix(`/api/v1/topics`) || PathPrefix(`/api/v1/events`)"
      - "traefik.http.services.content.loadbalancer.server.port=8000"
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 6. RAG SERVICE  (source_documents, chunks, embeddings)
  # ──────────────────────────────────────────────────────────
  sukyai-rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: sukyai-rag
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sukyai}:${POSTGRES_PASSWORD:-sukyai_secret}@sukyai-db:5432/sukyai_db
      SECRET_KEY: ${SECRET_KEY}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      S3_ENDPOINT_URL: http://sukyai-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      sukyai-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rag.rule=PathPrefix(`/api/v1/documents`) || PathPrefix(`/api/v1/search`)"
      - "traefik.http.services.rag.loadbalancer.server.port=8000"
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 7. STORY SERVICE  (story_versions, citations, images, review)
  # ──────────────────────────────────────────────────────────
  sukyai-story:
    build:
      context: .
      dockerfile: services/story/Dockerfile
    container_name: sukyai-story
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sukyai}:${POSTGRES_PASSWORD:-sukyai_secret}@sukyai-db:5432/sukyai_db
      SECRET_KEY: ${SECRET_KEY}
      S3_ENDPOINT_URL: http://sukyai-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      sukyai-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.story.rule=PathPrefix(`/api/v1/story`) || PathPrefix(`/api/v1/images`) || PathPrefix(`/api/v1/review-items`)"
      - "traefik.http.services.story.loadbalancer.server.port=8000"
    networks:
      - sukyai_net

  # ──────────────────────────────────────────────────────────
  # 8. AI WORKER  (background job processor — no HTTP exposure)
  # ──────────────────────────────────────────────────────────
  sukyai-ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    container_name: sukyai-ai-worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sukyai}:${POSTGRES_PASSWORD:-sukyai_secret}@sukyai-db:5432/sukyai_db
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      IMAGE_MODEL: ${IMAGE_MODEL:-dall-e-3}
      # Internal HTTP calls to peer services
      RAG_SERVICE_URL: http://sukyai-rag:8000
      STORY_SERVICE_URL: http://sukyai-story:8000
      CONTENT_SERVICE_URL: http://sukyai-content:8000
      S3_ENDPOINT_URL: http://sukyai-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sukyai}
      WORKER_ID: ${WORKER_ID:-worker-001}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      sukyai-db:
        condition: service_healthy
    # No traefik labels — worker không nhận HTTP từ bên ngoài
    networks:
      - sukyai_net
