services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db-migrate:
    build:
      context: ..
      dockerfile: SuKyAI_API/migrations/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app/shared
      - DATABASE_POOL_SIZE=0
      - DATABASE_MAX_OVERFLOW=0
    volumes:
      - ./services/auth/app:/app/app
      - ./shared:/app/shared
    ports:
      - "8001:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  content-service:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app/shared
      - ASSET_STORAGE_PATH=/app/assets
      - DATABASE_POOL_SIZE=0
      - DATABASE_MAX_OVERFLOW=0
    volumes:
      - ./services/content/app:/app/app
      - ./shared:/app/shared
      - ./secrets:/app/secrets:ro
      - content-assets:/app/assets
    ports:
      - "8002:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app/shared
      - DATABASE_POOL_SIZE=0
      - DATABASE_MAX_OVERFLOW=0
    volumes:
      - ./services/ai/app:/app/app
      - ./shared:/app/shared
      - ./static:/app/static
    ports:
      - "8003:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: ..
      dockerfile: SuKyAI_API/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  content-assets:
